# Baut die Still-Blocker täglich aus freien Listen, prüft sie mit WebKit (macOS) und veröffentlicht sie
# nur, wenn alle harten Prüfungen bestehen. Bei Fehlern bleibt die letzte gute Fassung online und es
# entsteht ein Issue (GitHub schickt dazu eine E-Mail).
name: Listen bauen und prüfen

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Rechte nur pro Job, so knapp wie möglich. Actions sind auf Commit-SHAs festgenagelt (Tag als Kommentar),
# Dependabot (.github/dependabot.yml) schlägt Updates wöchentlich vor.
permissions: {}

concurrency:
  group: lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Konverter bauen und testen
        run: |
          swift build -c release
          swift test
      - name: Listen bauen und prüfen
        run: python3 build.py
      - name: Prüfbericht sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bericht
          path: .build/lists/*.md
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - name: Warnungen als Issue melden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s .build/lists/warnings.md ] && grep -qv "Veröffentlichte Fassung nicht abrufbar" .build/lists/warnings.md; then
            gh issue list --label warnung --state open --json number --jq 'length' | grep -q '^0$' && \
            gh label create warnung --color FBCA04 --force >/dev/null && \
            gh issue create --label warnung --title "Listen-Prüfung: Warnung $(date +%F)" --body-file .build/lists/warnings.md
          fi
      - name: Fehler als Issue melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fehler --color D73A4A --force >/dev/null
          body=$(cat .build/lists/failures.md 2>/dev/null; echo; echo "Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          gh issue create --label fehler --title "Listen-Prüfung fehlgeschlagen $(date +%F)" --body "$body"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
